<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2142"/>
      <stop offset="1" stop-color="#050d1d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4f8f"/>
      <stop offset="1" stop-color="#0b2a55"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe3ff"/>
      <stop offset="0.5" stop-color="#3a8dff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fe3ff"/>
    </linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7fdcff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#37b6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#37b6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="dotglow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <path id="orbit" d="M170 76H342A94 94 0 0 1 436 170V342A94 94 0 0 1 342 436H170A94 94 0 0 1 76 342V170A94 94 0 0 1 170 76Z"/>
  </defs>

  <rect width="512" height="512" rx="56" fill="url(#bgc)"/>

  <circle cx="256" cy="256" r="260" fill="url(#halo)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.5s" repeatCount="indefinite"/>
    <rect x="76" y="76" width="360" height="360" rx="94" fill="url(#card)"/>
    <rect x="76" y="76" width="360" height="180" rx="94" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="78" y="78" width="356" height="356" rx="92" fill="none" stroke="url(#edge)" stroke-width="4"/>

    <path d="M172 346V166L256 278L340 166V346" fill="none" stroke="#4fc3ff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.8;0.35;0.8" keyTimes="0;0.45;0.6;0.8;1" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M172 346V166L256 278L340 166V346" fill="none" stroke="url(#mg)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="780" stroke-dashoffset="780">
      <animate attributeName="stroke-dashoffset" from="780" to="0" dur="1.3s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.5 0 0.2 1"/>
    </path>

    <circle r="10" fill="#9ae8ff" filter="url(#dotglow)">
      <animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
    </circle>
    <circle r="5" fill="#ffffff">
      <animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
    </circle>
  </g>
</svg>
